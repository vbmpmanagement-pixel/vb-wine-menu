<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VB Wine List</title>
<style>
:root {
  --bg: #101317;
  --panel: #171c23;
  --text: #f6f7f9;
  --muted: #aab4c3;
  --accent: #d8b57c;
  --line: #2a3341;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Georgia, serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

.container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

/* Header */
.header {
  text-align: center;
  padding: 52px 20px 28px;
  background: linear-gradient(180deg, rgba(216,181,124,0.06) 0%, var(--bg) 100%);
}
.header-ornament {
  color: var(--accent);
  font-size: 11px;
  letter-spacing: 8px;
  margin-bottom: 12px;
  opacity: 0.7;
}
.header h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 34px;
  font-weight: 400;
  letter-spacing: 4px;
  color: var(--text);
  text-transform: uppercase;
}
.header .subtitle {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-top: 8px;
  font-weight: 300;
}
.header-line {
  width: 60px;
  height: 1px;
  background: var(--accent);
  margin: 16px auto 0;
  opacity: 0.5;
}

/* Sticky bar */
.sticky-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(16, 19, 23, 0.92);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 0;
}
.search-wrap {
  position: relative;
  padding: 0 20px 10px;
  max-width: 800px;
  margin: 0 auto;
}
.search-input {
  width: 100%;
  padding: 10px 14px 10px 40px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  font-size: 15px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
}
.search-input::placeholder { color: var(--muted); opacity: 0.6; }
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 34px;
  top: calc(50% - 5px);
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  opacity: 0.5;
}

/* Nav pills */
.nav-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  max-width: 800px;
  margin: 0 auto;
  padding: 0 20px 12px;
  display: flex;
  gap: 8px;
}
.nav-scroll::-webkit-scrollbar { display: none; }
.nav-pill {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  background: var(--panel);
  border: 1px solid var(--line);
  white-space: nowrap;
  transition: all 0.25s;
  letter-spacing: 0.3px;
  cursor: pointer;
}
.nav-pill:hover,
.nav-pill.active {
  background: rgba(216, 181, 124, 0.1);
  color: var(--accent);
  border-color: rgba(216, 181, 124, 0.4);
}

/* Sections */
.wine-section { padding: 36px 0 8px; }
.section-title {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding-bottom: 14px;
  margin-bottom: 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
}
.section-title::before {
  content: '';
  width: 3px;
  height: 18px;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}

/* Wine cards */
.wine-card {
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.wine-card:last-child { border-bottom: none; }
.wine-info { flex: 1; min-width: 0; }
.wine-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.3;
}
.wine-meta {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}
.wine-desc {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
  margin-top: 5px;
  line-height: 1.4;
  opacity: 0.8;
}
.wine-price {
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  flex-shrink: 0;
  padding-top: 2px;
}

/* No results */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-style: italic;
  display: none;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
  font-size: 12px;
  opacity: 0.5;
}
</style>
</head>

  // Excluded varietals
  var EXCLUDED = ['Water', 'Misc', 'Sparkling Water', 'Still Water', 'Torrontes', 'Verdelho', 'Grenache', 'Garnacha', 'Beaujolais-Villages'];

  // Helper: make section ID from category name
  function sectionId(cat) {
    return 'cat-' + cat.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
  }

  // Format price
  function formatPrice(p) {
    return '$' + Number(p).toFixed(2).replace(/\.00$/, '');
  }

  // Get display category for a wine
  function getCategory(wine) {
    if (VARIETAL_MAP[wine.varietal]) return VARIETAL_MAP[wine.varietal];
    if (wine._cat) return wine._cat;
    return null;
  }

  // Filter and categorize wines
  function buildMenu(wines) {
    var sections = {};
    CATEGORY_ORDER.forEach(function(cat) { sections[cat] = []; });

    wines.forEach(function(w) {
      // Exclude zero price
      if (!w.retail || w.retail <= 0) return;
      // Exclude certain varietals
      if (EXCLUDED.indexOf(w.varietal) !== -1) return;
      var cat = getCategory(w);
      if (!cat || !sections[cat]) return;
      sections[cat].push(w);
    });

    // Sort each section alphabetically by name
    CATEGORY_ORDER.forEach(function(cat) {
      sections[cat].sort(function(a, b) {
        return a.name.localeCompare(b.name);
      });
    });

    return sections;
  }

  // Render HTML
  function renderMenu(sections) {
    var html = '';
    var navHtml = '';

    CATEGORY_ORDER.forEach(function(cat) {
      if (sections[cat].length === 0) return;
      var id = sectionId(cat);
      navHtml += '<a class="nav-pill" data-section="' + id + '">' + cat + '</a>';

      html += '<section class="wine-section" id="' + id + '">';
      html += '<h2 class="section-title">' + cat + '</h2>';

      sections[cat].forEach(function(w) {
        var meta = '';
        if (w.vintage && w.vintage !== 'NV') meta += w.vintage;
        if (w.format) {
          if (meta) meta += ' \u00b7 ';
          meta += w.format;
        }

        html += '<div class="wine-card" data-wine-id="' + w.id + '">';
        html += '<div class="wine-info">';
        html += '<div class="wine-name">' + w.name + '</div>';
        if (meta) html += '<div class="wine-meta">' + meta + '</div>';
        if (w.desc) html += '<div class="wine-desc">' + w.desc + '</div>';
        html += '</div>';
        html += '<div class="wine-price">' + formatPrice(w.retail) + '</div>';
        html += '</div>';
      });

      html += '</section>';
    });

    document.getElementById('wineContent').innerHTML = html;
    document.getElementById('navScroll').innerHTML = navHtml;
    initNavPills();
  }

  // Nav pill click handlers
  function initNavPills() {
    document.querySelectorAll('.nav-pill').forEach(function(pill) {
      pill.addEventListener('click', function(e) {
        e.preventDefault();
        document.querySelectorAll('.nav-pill').forEach(function(p) { p.classList.remove('active'); });
        this.classList.add('active');
        var target = document.getElementById(this.dataset.section);
        if (target) {
          window.scrollTo({ top: target.offsetTop - 130, behavior: 'smooth' });
        }
      });
    });
  }

  // Search
  function initSearch() {
    var input = document.getElementById('searchInput');
    input.addEventListener('input', function() {
      var query = this.value.trim().toLowerCase();
      var words = query ? query.split(/\s+/) : [];
      var cards = document.querySelectorAll('.wine-card');
      var sections = document.querySelectorAll('.wine-section');
      var anyVisible = false;

      cards.forEach(function(card) {
        if (words.length === 0) {
          card.style.display = '';
          return;
        }
        var text = card.textContent.toLowerCase();
        var wineId = card.dataset.wineId;
        // Also search varietal from INV data
        var wineData = INV.find(function(w) { return w.id === wineId; });
        if (wineData) {
          text += ' ' + (wineData.varietal || '').toLowerCase();
          text += ' ' + (wineData.vintage || '').toLowerCase();
        }
        var match = words.every(function(word) { return text.indexOf(word) !== -1; });
        card.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
      });

      // Show/hide sections
      sections.forEach(function(section) {
        var visibleCards = section.querySelectorAll('.wine-card:not([style*="display: none"])');
        section.style.display = visibleCards.length > 0 ? '' : 'none';
      });

      // No results message
      if (words.length > 0 && !anyVisible) {
        // Check again - anyVisible might be wrong if no words
        var allHidden = true;
        cards.forEach(function(c) { if (c.style.display !== 'none') allHidden = false; });
        document.getElementById('noResults').style.display = allHidden ? 'block' : 'none';
      } else {
        document.getElementById('noResults').style.display = 'none';
      }

      // When cleared, show all sections
      if (words.length === 0) {
        sections.forEach(function(s) { s.style.display = ''; });
      }
    });
  }

  // Live sync from GAS
  var syncTimer = null;

  function liveSync() {
    fetch(GAS_URL)
      .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data) {
        if (!data) return;
        applyLiveData(data);
      })
      .catch(function() {});
  }

  function applyLiveData(data) {
    var archived = data.archived || {};
    var deletedIds = data.deletedIds || [];
    var state = data.state || {};

    // First: hide wines that start at 0 qty (baked into HTML)
    INV.forEach(function(w) {
      var s = state[w.id];
      var live = w.sq - (s ? Number(s.used || 0) : 0) + (s ? Number(s.added || 0) : 0);
      if (live <= 0) {
        var el = document.querySelector('[data-wine-id="' + w.id + '"]');
        if (el) el.style.display = 'none';
      }
    });

    // Hide archived wines
    Object.keys(archived).forEach(function(id) {
      var el = document.querySelector('[data-wine-id="' + id + '"]');
      if (el) el.style.display = 'none';
    });

    // Hide deleted wines
    deletedIds.forEach(function(id) {
      var el = document.querySelector('[data-wine-id="' + id + '"]');
      if (el) el.style.display = 'none';
    });

    // Hide empty sections
    document.querySelectorAll('.wine-section').forEach(function(section) {
      var cards = section.querySelectorAll('.wine-card');
      var anyVisible = false;
      cards.forEach(function(c) { if (c.style.display !== 'none') anyVisible = true; });
      section.style.display = anyVisible ? '' : 'none';
    });

    // BTG section
    var btgWines = data.btgWines || [];
    var btgEl = document.getElementById('btgSection');
    if (btgWines.length > 0 && btgEl) {
      var html = '<h2 class="section-title" style="color:#7C3AED">By the Glass</h2>';
      btgWines.forEach(function(w) {
        var name = w.name;
        if (!name) { var inv = INV.find(function(i) { return i.id === w.id; }); if (inv) name = inv.name; }
        if (!name) return;
        html += '<div class="wine-card" style="border-left:3px solid #7C3AED"><div class="wine-info"><div class="wine-name">' + name + '</div>';
        if (w.varietal) html += '<div class="wine-meta">' + w.varietal + '</div>';
        var pills = '';
        (w.pourSizes || []).forEach(function(p) {
          pills += '<span style="display:inline-block;background:rgba(124,58,237,0.15);color:#b794f6;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;margin-right:6px;margin-top:4px">' + (p.label || p.oz + 'oz') + ' &middot; $' + p.price + '</span>';
        });
        if (pills) html += '<div>' + pills + '</div>';
        html += '</div></div>';
      });
      btgEl.innerHTML = html;
      btgEl.style.display = '';
    } else if (btgEl) {
      btgEl.style.display = 'none';
    }
  }

  // Smart polling with visibility API
  function startPolling() {
    liveSync();
    if (syncTimer) clearInterval(syncTimer);
    syncTimer = setInterval(liveSync, 30000);

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = null;
      } else {
        liveSync();
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(liveSync, 30000);
      }
    });
  }

  // Initialize
  var sections = buildMenu(INV);
  renderMenu(sections);
  initSearch();
  startPolling();

})();
</script>
</body>
</html>
